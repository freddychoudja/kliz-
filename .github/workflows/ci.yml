name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests with coverage
        run: python -m pytest --cov=kliz --cov-report=term-missing

  quality:
    name: Lint and typing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: ruff format --check src tests
      - name: Lint
        run: ruff check src tests
      - name: Type-check
        run: mypy src
      - name: Audit runtime dependencies
        run: pip-audit . --strict

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install "build>=1.2,<2.0" "twine>=5.1,<7.0"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata and README
        run: python -m twine check --strict dist/*
      - name: Install and import the built wheel (without extras)
        run: |
          python -m venv wheel-venv
          wheel-venv/bin/python -m pip install dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/wheel-venv/bin/python" - <<'EOF'
          import importlib.util
          import kliz
          from kliz import GoogleProvider, IndexNowProvider, MissingDependencyError

          print(kliz.__version__)
          assert importlib.util.find_spec("googleapiclient") is None
          IndexNowProvider(api_key=IndexNowProvider.generate_key())
          try:
              GoogleProvider("sa.json")
          except MissingDependencyError as exc:
              assert "kliz[google]" in str(exc)
          else:
              raise AssertionError("GoogleProvider must require the google extra")
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  action:
    name: GitHub Action (dry run)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Dry run from a sitemap
        uses: ./
        with:
          sitemap: tests/fixtures/sitemap.xml
          since: "2026-09-01"
          dry-run: true
      - name: Dry run from a URL list
        uses: ./
        with:
          urls: |
            https://example.com/a
            https://example.com/b
          dry-run: true
