name: Bug report
description: Report incorrect or unexpected behavior
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Never post an API key or a service account file. Issues in French are welcome too.
  - type: input
    id: version
    attributes:
      label: kliz version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Affected component
      options:
        - IndexNowProvider
        - GoogleSearchConsoleProvider
        - GoogleProvider (Indexing API)
        - Sitemap reading
        - CLI
        - GitHub Action
        - Kliz / orchestration
        - Custom provider
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      render: python
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Cleaned traceback or logs
      description: Remove every secret and credential before posting.
      render: shell
