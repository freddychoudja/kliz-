name: Question
description: Ask how to do something with kliz
title: "[Question] "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: >-
        Check the [documentation site](https://freddychoudja.github.io/kliz-/) and
        [SUPPORT.md](https://github.com/freddychoudja/kliz-/blob/main/SUPPORT.md) first.
        Remove API keys and service account content before posting.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what have you tried?
    validations:
      required: true
  - type: dropdown
    id: usage
    attributes:
      label: How do you run kliz?
      options:
        - Command line
        - GitHub Action
        - Python library
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: kliz version
      description: Output of `kliz --version`.
