name: Feature request
description: Suggest a provider or an API improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the concrete need and the current limitations.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired API or behavior.
    validations:
      required: true
  - type: checkboxes
    id: architecture
    attributes:
      label: Architecture fit
      options:
        - label: The proposal keeps the core independent of application frameworks.
          required: true
        - label: A new engine can be implemented as a provider.
          required: false
