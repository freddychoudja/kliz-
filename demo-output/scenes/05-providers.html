<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e17; width: 1920px; height: 1080px; display: flex;
  align-items: center; justify-content: center; font-family: 'SF Mono', 'Fira Code', monospace; }
.container { text-align: center; }
.title { font-size: 48px; color: #e5e7eb; font-weight: 700; margin-bottom: 60px; }
.providers { display: flex; gap: 60px; justify-content: center; }
.card { background: #111827; border: 1px solid #1f2937; border-radius: 16px;
  padding: 40px 48px; width: 360px; text-align: center; }
.card .icon { font-size: 56px; margin-bottom: 16px; }
.card .name { font-size: 24px; color: #e5e7eb; font-weight: 600; margin-bottom: 8px; }
.card .desc { font-size: 16px; color: #6b7280; line-height: 1.6; }
.card .badge { display: inline-block; margin-top: 16px; padding: 6px 16px;
  border-radius: 20px; font-size: 14px; font-weight: 600; }
.badge.now { background: rgba(0,212,170,0.15); color: #00d4aa; }
.badge.lazy { background: rgba(59,130,246,0.15); color: #3b82f6; }
</style></head><body>
<div class="container">
  <div class="title">Multi-Provider Support</div>
  <div class="providers">
    <div class="card">
      <div class="icon">🔗</div>
      <div class="name">IndexNow</div>
      <div class="desc">Bing, Yandex, Naver, Seznam<br>10,000 URLs per request</div>
      <div class="badge now">Instant</div>
    </div>
    <div class="card">
      <div class="icon">🔍</div>
      <div class="name">Google Indexing</div>
      <div class="desc">Official Google Indexing API<br>Pages eligible for indexing</div>
      <div class="badge lazy">Lazy-loaded</div>
    </div>
  </div>
</div>
</body></html>
