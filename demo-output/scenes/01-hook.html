<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e17; width: 1920px; height: 1080px; display: flex;
  align-items: center; justify-content: center; font-family: 'SF Mono', 'Fira Code', monospace; }
.container { text-align: center; }
.logo { font-size: 140px; font-weight: 900; color: #00d4aa;
  text-shadow: 0 0 60px rgba(0,212,170,0.3); letter-spacing: -4px;
  animation: glow 2s ease-in-out infinite alternate; }
.tagline { font-size: 28px; color: #6b7280; margin-top: 24px;
  letter-spacing: 6px; text-transform: uppercase; }
@keyframes glow {
  from { text-shadow: 0 0 40px rgba(0,212,170,0.2); }
  to { text-shadow: 0 0 80px rgba(0,212,170,0.5); }
}
</style></head><body>
<div class="container">
  <div class="logo">kliz</div>
  <div class="tagline">SEO Indexing · Simplified</div>
</div>
</body></html>
